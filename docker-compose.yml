# Local PostgreSQL for development; README.md#set-up-the-backend shows how to point the API at it.
services:
  db:
    image: postgres:16-alpine
    container_name: nudge-db
    environment:
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: nudge
      POSTGRES_DB: nudge
    ports:
      - '5432:5432'
    volumes:
      - nudge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nudge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nudge_pgdata:
